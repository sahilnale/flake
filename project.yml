name: Flake
options:
  bundleIdPrefix: bigbacks
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0

targets:
  Flake:
    type: application
    platform: iOS
    sources:
      - path: Flake
        excludes:
          - Theme.swift
          - Components/AvatarView.swift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flake.app
        INFOPLIST_FILE: Flake/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
        product: Supabase
      - target: FlakeMessages
        embed: true

  FlakeMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: FlakeMessages
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flake.app.messages
        INFOPLIST_FILE: FlakeMessages/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
    dependencies:
      - package: Supabase
        product: Supabase
